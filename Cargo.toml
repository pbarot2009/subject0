[package]
name = "subject0"
version = "0.1.0-alpha.1"
edition = "2024"
authors = ["Prathmesh S. Barot"]
description = "Modal terminal code editor with LSP client and Tree-sitter highlighting."
repository = "https://github.com/pbarot2009/subject0"
readme = "README.md"
license = "MIT OR Apache-2.0"
autotests = false
keywords = ["editor", "terminal", "tui", "lsp", "modal"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "s0"
path = "src/main.rs"

[dependencies]
# Terminal TUI and Event Handling
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Text buffer data structure
ropey = "1.6"

# Asynchronous runtime for LSP communication & child process supervisor
tokio = { version = "1.38", features = [
    "rt-multi-thread",
    "process",
    "sync",
    "io-util",
    "macros",
    "time",
] }

# Pure Rust Git engine and line diffing
gix = { version = "0.68", default-features = false, features = ["revision", "blob-diff", "parallel"] }
imara-diff = "0.1"

# Cross-platform executable and directory resolution across Termux, Linux, macOS, and Windows
which = "7.0"
dirs = "6.0"

# Pure Tree-sitter core & highlight query runtime
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"

# Built into the binary (top 10). Everything else is `s0 --grammar install <lang>`.
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-html = "0.23"
tree-sitter-md = "0.5"

# Newly added statically compiled grammars

# Serialization & Official Language Server Protocol 3.17+ Types
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lsp-types = { version = "0.97.0", features = ["proposed"] }
url = { version = "2.5", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Per-language grammar fetch/build (not fetch-all) and languages.toml
libloading = "0.8"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[lints.rust]
unused_must_use = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
module_name_repetitions = "allow"
doc_markdown = "warn"
manual_string_new = "warn"
semicolon_if_nothing_returned = "warn"
needless_pass_by_value = "allow"
collapsible_if = "allow"
uninlined_format_args = "allow"
map_unwrap_or = "allow"
redundant_closure = "allow"
redundant_closure_for_method_calls = "allow"
manual_let_else = "allow"
match_same_arms = "allow"
needless_raw_string_hashes = "allow"
result_large_err = "allow"
elidable_lifetime_names = "allow"
implicit_clone = "allow"
manual_find = "allow"
needless_borrow = "allow"
format_collect = "allow"
unused_self = "allow"
wildcard_imports = "allow"
unnecessary_cast = "allow"
needless_range_loop = "allow"
format_push_string = "allow"
unnecessary_wraps = "allow"
