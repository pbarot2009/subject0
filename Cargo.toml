[package]
name = "subject0"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "s0"
path = "src/main.rs"

[dependencies]
# Terminal TUI and Event Handling
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Text buffer data structure
ropey = "1.6"

# Asynchronous runtime for LSP and streaming
tokio = { version = "1.38", features = ["full"] }

# Tree-sitter parser and language grammars
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"

# Serialization for JSON-RPC LSP communication
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
