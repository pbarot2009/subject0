[package]
name = "subject0"
version = "0.1.0-alpha.1"
edition = "2024"
authors = ["Prathmesh S. Barot"]
description = "Modal terminal code editor with LSP client and Tree-sitter highlighting."
repository = "https://github.com/pbarot2009/subject0"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["editor", "terminal", "tui", "lsp", "modal"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "s0"
path = "src/main.rs"

[dependencies]
# Terminal TUI and Event Handling
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Text buffer data structure
ropey = "1.6"

# Asynchronous runtime for LSP communication & child process supervisor
tokio = { version = "1.38", features = [
    "rt-multi-thread",
    "process",
    "sync",
    "io-util",
    "macros",
    "time",
] }

# Cross-platform executable and directory resolution across Termux, Linux, macOS, and Windows
which = "7.0"
dirs = "6.0"

# Pure Tree-sitter core & highlight query runtime
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"

# Statically compiled, zero-lag grammars for primary languages
tree-sitter-rust = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-zig = "1.1.2"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-bash = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-md = "0.3"
tree-sitter-java = "0.23"

# Serialization & Official Language Server Protocol 3.17+ Types
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lsp-types = { version = "0.97.0", features = ["proposed"] }
url = { version = "2.5", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unused_must_use = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
doc_markdown = "warn"
manual_string_new = "warn"
semicolon_if_nothing_returned = "warn"
