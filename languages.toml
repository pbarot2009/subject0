# Grammar sources for per-language install.
# Derived from Helix (https://github.com/helix-editor/helix), MPL-2.0.
# Install one language at a time:
#   s0 --grammar install rust
#   s0 --grammar fetch python
#   s0 --grammar build python
#   s0 --grammar list
#   s0 --grammar remove rust

